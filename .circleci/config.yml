version: 2.1

orbs:
  architect: giantswarm/architect@10.13.9
  codecov: codecov/codecov@6.1.0

workflows:
  test:
    jobs:
    - run-tests:
        name: run-tests
        filters:
            # Needed to trigger job also on git tag.
          tags:
            only: /^v.*/

    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        requires:
        - run-tests
        registries-data: |-
          public gsoci.azurecr.io ACR_GSOCI_USERNAME ACR_GSOCI_PASSWORD false
        filters:
          # Release tags only: run-tests builds the image on branches, and the dev
          # images this job would build there are not pushed.
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

jobs:
  run-tests:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
    - checkout
    - run:
        command: mkdir -p .coverage

    - run:
        name: Execute tests
        command: |
          make docker-test-ci

    - codecov/upload:
        verbose: true
