name: App Catalog Cleanup

on:
  workflow_call:
    inputs:
      app-regexp:
        description: "Regexp of app names the cleanup will apply to"
        default: ".*"
        required: false
        type: string
      keep-since:
        description: "A full date-time. Catalog entries older than this timestamp will be removed"
        required: false
        type: string
      delete-before:
        description: "A time delta (like '3 days' or '4 weeks') to keep catalog entries. Catalog entries older will be removed"
        required: false
        type: string
      limit-number:
        description: "Most recent versions to keep in the catalog"
        required: false
        type: string
      pre-release:
        description: "Regexp the pre-release part of a version must fully match, like 'rc[.][0-9]+'; only these are removed"
        required: false
        type: string
      debug:
        description: "Enable debug mode"
        default: true
        required: false
        type: boolean
      dry-run:
        description: "Enable dry-run mode"
        default: true
        required: false
        type: boolean

jobs:
  cleanup:
    name: Run the ACC tool
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ignore index.yaml.back file
        run: echo "index.yaml.back" >> .git/info/exclude

      - name: Check for dry-run
        id: dry-run
        run: |
          if [ ${{ inputs.dry-run }} = true ]
          then
            echo "dry-run=--dry-run" >> $GITHUB_OUTPUT
          else
            echo "dry-run=" >> $GITHUB_OUTPUT
          fi

      - name: Check for debug
        id: debug
        run: |
          if [ ${{ inputs.debug }} = true ]
          then
            echo "debug=--debug" >> $GITHUB_OUTPUT
          else
            echo "debug=" >> $GITHUB_OUTPUT
          fi

      - name: Conclude condition
        id: condition
        run: |
          if [[ ! -z "${{ inputs.keep-since }}" ]]
          then
            echo "condition=--keep-since \"${{ inputs.keep-since }}\"" >> $GITHUB_OUTPUT
          elif [[ ! -z "${{ inputs.delete-before }}" ]]
          then
            echo "condition=--delete-before \"${{ inputs.delete-before }}\"" >> $GITHUB_OUTPUT
          elif [[ ! -z "${{ inputs.limit-number }}" ]]
          then
            echo "condition=--limit-number \"${{ inputs.limit-number }}\"" >> $GITHUB_OUTPUT
          else
            echo "condition=" >> $GITHUB_OUTPUT
          fi

      - name: Check for pre-release
        id: pre-release
        run: |
          if [[ ! -z "${{ inputs.pre-release }}" ]]
          then
            echo "pre-release=--pre-release \"${{ inputs.pre-release }}\"" >> $GITHUB_OUTPUT
          else
            echo "pre-release=" >> $GITHUB_OUTPUT
          fi

      - name: Execute ACC tool
        uses: docker://gsoci.azurecr.io/giantswarm/app-catalog-cleanup-tool:0.4.1
        with:
          args: -a "${{ inputs.app-regexp }}" ${{ steps.pre-release.outputs.pre-release }} ${{ steps.condition.outputs.condition }} ${{ steps.dry-run.outputs.dry-run }} .

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1

      - name: Recreate the repository index.yaml
        run: |
          mkdir /tmp/build.tmp
          helm repo index --url "https://giantswarm.github.io/$(echo -n ${{ env.GITHUB_REPOSITORY }} | cut -d '/' -f2)" --merge index.yaml /tmp/build.tmp
          sudo cp /tmp/build.tmp/index.yaml .

      # Pushing a new branch, git sends only the objects missing from the refs the
      # remote advertises and the runner has. Catalogs get new charts every few
      # minutes, so the base branch usually moves after the shallow checkout. Then
      # git finds no common object and uploads the whole tree (GiBs), which GitHub
      # cuts off with HTTP 500 after about a minute. Fetching the current tip of the
      # base branch right before the push keeps the push down to the changed files.
      - name: Fetch the current tip of the base branch
        if: ${{ ! inputs.dry-run }}
        run: |
          base="$(git branch --show-current)"
          git fetch --depth=1 origin "+refs/heads/${base}:refs/remotes/origin/${base}"

      - name: Create Pull Request
        id: pull-request
        if: ${{ ! inputs.dry-run }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          title: Periodic App Catalog Cleanup
          commit-message: Periodic App Catalog Cleanup
          branch: cleanup/acct-run-${{ github.run_id }}
          delete-branch: true
          draft: false
          body: |
            Periodic cleanup.

            - Application Regexp: `${{ inputs.app-regexp }}`
            - Cleanup Condition: `${{ steps.pre-release.outputs.pre-release }} ${{ steps.condition.outputs.condition }}`
            - Created By: [ACCT Github Workflow][1]

            [1]: https://raw.githubusercontent.com/giantswarm/app-catalog-cleanup-tool/feature/cleanup-workflow/.github/workflows/cleanup.yaml

      # The branch is unique to this run, so any pull request on it is this run's.
      # Do not require operation 'created': when the create call times out after
      # GitHub has already opened the pull request, the action retries, finds it
      # and reports 'none', and the cleanup would be left unmerged.
      - name: Merge Pull Request
        if: steps.pull-request.outputs.pull-request-number != '' && steps.pull-request.outputs.pull-request-operation != 'closed'
        uses: juliangruber/merge-pull-request-action@8325c6102b479a25200b2ecbede066b1ac3e2feb # v1.4.0
        with:
          github-token: ${{ github.token }}
          number: ${{ steps.pull-request.outputs.pull-request-number }}
          method: squash
